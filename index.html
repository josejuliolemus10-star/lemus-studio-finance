<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/lemus-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemus Studio — Private Financial Dashboard</title>
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#06141B] text-[#CCD0CF] antialiased selection:bg-[#253745] selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      // Detección si se abre por doble clic directo en el archivo (file://)
      if (window.location.protocol === 'file:') {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            document.body.innerHTML = `
              <div style="min-height:100vh;background:#000000;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;padding:24px;text-align:center;">
                <div style="background:#0D0D0D;border:1px solid #242424;padding:36px;border-radius:20px;max-width:520px;box-shadow:0 20px 40px rgba(0,0,0,0.8);">
                  <div style="width:52px;height:52px;background:#171717;border:1px solid #333;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px auto;font-weight:bold;font-size:18px;">LS</div>
                  <h2 style="font-size:22px;font-weight:700;margin-bottom:12px;letter-spacing:-0.02em;">Lemus Studio — Dashboard</h2>
                  <p style="color:#9BA8AB;font-size:14px;line-height:1.6;margin-bottom:24px;">
                    Has abierto <code>index.html</code> directamente con doble clic. Al ser una aplicación React completa con persistencia y exportador Excel, debe ejecutarse a través de su enlace local.
                  </p>
                  <a href="http://localhost:5173/" style="display:inline-block;background:#FFFFFF;color:#000000;padding:12px 24px;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px;transition:all 0.2s;">
                    👉 Entrar al Dashboard (http://localhost:5173/)
                  </a>
                  <p style="color:#666;font-size:12px;margin-top:20px;line-height:1.5;">
                    💡 También puedes hacer doble clic en el archivo <strong>Abrir_Dashboard.bat</strong> que dejamos en tu carpeta o en tu Escritorio.
                  </p>
                </div>
              </div>
            `;
          }
        }, 300);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
